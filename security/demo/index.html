<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Login - Security Module</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 14px; padding: 36px 32px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  h1 { font-size: 20px; color: #333; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
  .warn { background: #fff8e1; border: 1px solid #f5a623; color: #8a5a00; font-size: 12px; border-radius: 8px; padding: 10px 12px; margin-bottom: 20px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; color: #555; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #667eea; }
  button { width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 8px; background: #5b5fd9; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #b6b8e8; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; line-height: 1.5; }
  .msg.err { display: block; background: #fdecea; color: #8a1a12; }
  .msg.ok { display: block; background: #e6f4ea; color: #1e7e34; }
  .msg.warn { display: block; background: #fff8e1; color: #8a5a00; }
  .attempts { font-size: 12px; color: #999; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Demo: Modul Keamanan</h1>
    <p class="sub">Halaman login dengan proteksi 3x gagal + cooldown 5 menit</p>

    <div class="warn">
      <b>HALAMAN DEMO</b> — autentikasi di sini hanya SIMULASI lokal untuk
      menguji UX keamanan. Password demo: <b>demo123</b> (admin: <b>admin</b> / user: <b>budi</b>).
      Ini BUKAN bagian dari modul keamanan dan TIDAK boleh dipakai di produksi.
    </div>

    <form id="loginForm" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="submitBtn" type="submit">Masuk</button>
    </form>

    <div id="msg" class="msg"></div>
    <div id="attempts" class="attempts"></div>
  </div>

  <script>
    // Pelacak error khusus demo (membantu debugging integrasi)
    window.__secErrors = [];
    window.addEventListener('error', (e) => window.__secErrors.push('window.onerror: ' + e.message));
    window.addEventListener('unhandledrejection', (e) => window.__secErrors.push('unhandledrejection: ' + (e.reason && e.reason.message)));
  </script>
  <script type="module">
    import { initSecurity } from '../security.js';

    // Inisialisasi modul dari folder /security (satu pintu).
    const sec = initSecurity({
      LOGIN_PAGE: '/security/demo/index.html',
      PROTECTED_ROUTES: ['/security/demo/dashboard.html', '/security/demo/admin.html'],
      ADMIN_ROUTES: ['/security/demo/admin.html'],
    });

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    const attemptsEl = document.getElementById('attempts');

    // ---------- Tampilkan pesan berdasarkan ?reason= ----------
    const params = new URLSearchParams(location.search);
    const reason = params.get('reason');
    if (reason && sec.enabled) {
      const M = sec.config.MESSAGES;
      const map = {
        auto_logout: M.SESSION_TIMEOUT,
        session_revoked: M.SESSION_REVOKED,
        session_expired: M.SESSION_EXPIRED,
        login_required: 'Silakan login terlebih dahulu untuk membuka halaman tersebut.',
        logout: M.LOGGED_OUT,
      };
      const text = map[reason];
      if (text) {
        msg.className = reason === 'logout' ? 'msg ok' : 'msg warn';
        // Ganti placeholder (mis. {minutes} -> 15) sesuai konfigurasi aktif
        const minutes = Math.max(1, Math.round(sec.config.INACTIVITY_TIMEOUT / 60000));
        msg.textContent = text.replace('{minutes}', String(minutes)); // textContent = aman dari XSS
      }
    }

    // ---------- Status blokir saat halaman dibuka ----------
    function refreshStatus() {
      const st = sec.login.getStatus();
      if (st.blocked) {
        btn.disabled = true;
        const s = Math.ceil(st.retryAfterMs / 1000);
        msg.className = 'msg err';
        msg.textContent = sec.login.getBlockedMessage();
        attemptsEl.textContent = `Coba lagi dalam ${Math.floor(s / 60)} menit ${s % 60} detik`;
        setTimeout(refreshStatus, 1000);
      } else {
        btn.disabled = false;
        attemptsEl.textContent = `Sisa percobaan: ${st.remainingAttempts} dari ${st.maxAttempts}`;
      }
    }
    refreshStatus();

    // ---------- Submit: proteksi dulu, baru simulasi auth ----------
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      msg.className = 'msg';

      const check = sec.login.checkAllowed();
      if (!check.allowed) { refreshStatus(); return; }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // ====== SIMULASI AUTENTIKASI LOKAL (DEMO SAJA) ======
      // Di aplikasi nyata: panggil API server Anda di sini, lalu:
      //   - gagal  -> sec.login.recordFailure()
      //   - sukses -> sec.session.create({userId, role})
      const valid = password === 'demo123';
      const role = username.toLowerCase() === 'admin' ? 'admin' : 'user';

      if (!valid) {
        const after = sec.login.recordFailure();
        if (after.blocked) {
          msg.className = 'msg err';
          msg.textContent = sec.login.getBlockedMessage();
          refreshStatus();
        } else {
          msg.className = 'msg err';
          msg.textContent = `Password salah. Sisa percobaan: ${after.remainingAttempts}.`;
        }
        return;
      }

      // ====== LOGIN SUKSES: buat sesi lewat modul keamanan ======
      sec.session.create({ userId: username, role });

      msg.className = 'msg ok';
      msg.textContent = 'Login berhasil. Mengalihkan ke dashboard...';

      const next = params.get('next');
      setTimeout(() => {
        location.assign(next && next.startsWith('/') ? next : '/security/demo/dashboard.html');
      }, 600);
    });
  </script>
</body>
</html>
