# ============================================================================
# SIMANTRI v2 — Deploy to GitHub Pages
# ============================================================================
# Workflow ini otomatis:
#   1. Install dependencies
#   2. Build Vite project dengan VITE_BASE_PATH = /<nama-repo>/
#      (auto-detect dari nama repo, jadi tidak perlu hardcode)
#   3. Upload artifact
#   4. Deploy ke GitHub Pages
#
# Trigger: setiap push ke branch main / master
#
# Setup sekali saja:
#   Repo → Settings → Pages → Source: GitHub Actions
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel deployment sebelumnya jika push baru terjadi
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect base path
        id: base
        run: |
          # Jika repo adalah user/organization page (USERNAME.github.io),
          # base harus '/'. Jika project page, base = '/REPO_NAME/'.
          REPO="${GITHUB_REPOSITORY##*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "base=/" >> $GITHUB_OUTPUT
            echo "Detected user/org page → base '/'"
          else
            echo "base=/$REPO/" >> $GITHUB_OUTPUT
            echo "Detected project page → base '/$REPO/'"
          fi

      - name: Build
        env:
          # Base path untuk GitHub Pages project site
          VITE_BASE_PATH: ${{ steps.base.outputs.base }}
          # Supabase credentials dari repo secrets (setup di Settings → Secrets)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_NAME: SIMANTRI
          VITE_APP_TAGLINE: Sistem Informasi & Manajemen Praktik Nakes
          # Build production
          NODE_ENV: production
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Verify dist/index.html exists ==="
          if [ ! -f dist/index.html ]; then
            echo "❌ dist/index.html NOT FOUND — build failed"
            exit 1
          fi
          echo "✅ dist/index.html found"

          echo ""
          echo "=== Verify script & link tags in dist/index.html ==="
          grep -E '<(script|link)' dist/index.html || true

          echo ""
          echo "=== Verify assets folder ==="
          ls -la dist/assets/ | head -20

          echo ""
          echo "=== Verify 404.html & favicon.svg exist ==="
          ls -la dist/404.html dist/favicon.svg 2>&1 || true

          echo ""
          echo "=== Verify no 'src/main.js' reference (should be bundled) ==="
          if grep -q 'src/main.js' dist/index.html; then
            echo "❌ Found 'src/main.js' reference — build did NOT bundle JS!"
            echo "   This will cause MIME type error in production."
            exit 1
          else
            echo "✅ No 'src/main.js' reference — JS properly bundled"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
