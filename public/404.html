<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMANTRI</title>
  <script>
    // ============================================================================
    // GitHub Pages SPA redirect fallback
    // ============================================================================
    // Saat user mengakses URL non-hash yang tidak ada (mis. /repo/data-nakes),
    // GitHub Pages akan menampilkan 404.html ini. Kita redirect ke index.html
    // dengan path asli sebagai query, lalu router hash akan menanganinya.
    //
    // Trick ini mengatasi kasus refresh atau direct-link ke route SPA.
    // Karena router SIMANTRI memakai hash routing (#/dashboard), refresh halaman
    // sebenarnya TIDAK akan 404. Tapi 404.html ini sebagai safety net untuk
    // URL non-hash yang mungkin ter-share.
    // ============================================================================

    // Simpan path asli ke sessionStorage, lalu redirect ke root
    var pathSegmentsToKeep = 0; // untuk user page; project page bisa sesuaikan
    var l = window.location;
    var repoPrefix = '';

    // Deteksi apakah ini project page (ada subpath setelah domain)
    // Contoh: https://user.github.io/simantri-nakes-v2/data-nakes
    // Pathname akan: /simantri-nakes-v2/data-nakes
    // Kita perlu preserve /simantri-nakes-v2/ sebagai prefix
    var pathParts = l.pathname.split('/').filter(Boolean);
    if (pathParts.length > 1) {
      // Asumsikan segmen pertama adalah nama repo
      repoPrefix = '/' + pathParts[0] + '/';
    } else {
      repoPrefix = '/';
    }

    // Redirect ke root dengan hash yang sesuai
    var redirect = repoPrefix + '#/' + pathParts.slice(1).join('/');
    l.replace(redirect);
  </script>
  <meta http-equiv="refresh" content="0; url=./" />
</head>
<body>
  <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center;">
    Mengalihkan ke <a href="./">SIMANTRI</a>...
  </p>
</body>
</html>
