<!-- SIMANTRI stat-card — komponen reusable.
     Pola penggunaan: ganti attribute data-* untuk varian. -->
<div class="card card-hover p-5">
  <div class="flex items-start justify-between gap-3">
    <div class="flex-1 min-w-0">
      <p class="text-xs font-semibold text-ink-500 uppercase tracking-wider" data-stat-label>Total Nakes</p>
      <p class="mt-2 text-3xl font-extrabold text-ink-900 tabular-nums" data-stat-value>0</p>
      <p class="mt-1.5 text-xs text-ink-500" data-stat-sub>0 tenaga medis • 0 tenaga kesehatan</p>
    </div>
    <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" data-stat-icon-wrap>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" data-stat-icon>
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4zm6 0a3 3 0 10-2-5.24"/>
      </svg>
    </div>
  </div>
  <div class="mt-3 flex items-center gap-1.5 text-xs" data-stat-trend>
    <span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-md bg-teal-50 text-teal-700 font-semibold">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
      12%
    </span>
    <span class="text-ink-500">vs bulan lalu</span>
  </div>
</div>
