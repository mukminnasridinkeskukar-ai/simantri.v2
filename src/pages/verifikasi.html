<!-- SIMANTRI — Verifikasi STR & SIP -->
<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <p class="text-xs font-semibold text-teal-600 uppercase tracking-wider">Antrian Verifikasi Dokumen</p>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-ink-900 mt-1">Verifikasi STR &amp; SIP</h2>
      <p class="text-sm text-ink-600 mt-1.5">Tinjau dan approve/reject pengajuan STR &amp; SIP tenaga kesehatan</p>
    </div>
    <div class="flex gap-2">
      <button class="btn-outline btn-sm" data-action="refresh">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>
      <button class="btn-primary btn-sm" data-action="export">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Export
      </button>
    </div>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="verifikasi-stats">
    <div class="skeleton h-28"></div>
    <div class="skeleton h-28"></div>
    <div class="skeleton h-28"></div>
    <div class="skeleton h-28"></div>
  </div>

  <!-- Filter bar -->
  <div class="card p-4">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
      <!-- Search -->
      <div class="md:col-span-5 relative">
        <svg class="w-4 h-4 text-ink-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="search" id="verifikasi-search" placeholder="Cari nama nakes atau no dokumen..." class="input !pl-9" aria-label="Cari verifikasi" />
      </div>
      <!-- Jenis dok filter -->
      <div class="md:col-span-3">
        <select id="verifikasi-filter-jenis" class="select" aria-label="Filter jenis dokumen">
          <option value="">Semua Jenis</option>
          <option value="STR">STR</option>
          <option value="SIP">SIP</option>
          <option value="Rekomendasi">Rekomendasi</option>
        </select>
      </div>
      <!-- Date range -->
      <div class="md:col-span-2">
        <input type="date" id="verifikasi-filter-from" class="input" aria-label="Dari tanggal" title="Dari tanggal" />
      </div>
      <div class="md:col-span-2">
        <input type="date" id="verifikasi-filter-to" class="input" aria-label="Sampai tanggal" title="Sampai tanggal" />
      </div>
    </div>
  </div>

  <!-- Kanban board -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4" id="verifikasi-board">
    <!-- Column: Pending -->
    <div class="card flex flex-col" data-column="pending">
      <div class="px-5 py-4 border-b border-ink-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse-dot"></span>
          <h3 class="font-bold text-ink-900">Menunggu Verifikasi</h3>
        </div>
        <span class="badge-amber !text-xs" id="count-pending">0</span>
      </div>
      <div class="flex-1 p-3 space-y-3 min-h-[300px] bg-amber-50/30" id="col-pending">
        <div class="skeleton h-24"></div>
        <div class="skeleton h-24"></div>
      </div>
    </div>

    <!-- Column: Verified -->
    <div class="card flex flex-col" data-column="verified">
      <div class="px-5 py-4 border-b border-ink-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-teal-500"></span>
          <h3 class="font-bold text-ink-900">Diverifikasi</h3>
        </div>
        <span class="badge-teal !text-xs" id="count-verified">0</span>
      </div>
      <div class="flex-1 p-3 space-y-3 min-h-[300px] bg-teal-50/30" id="col-verified">
        <div class="skeleton h-24"></div>
      </div>
    </div>

    <!-- Column: Rejected -->
    <div class="card flex flex-col" data-column="rejected">
      <div class="px-5 py-4 border-b border-ink-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
          <h3 class="font-bold text-ink-900">Ditolak</h3>
        </div>
        <span class="badge-rose !text-xs" id="count-rejected">0</span>
      </div>
      <div class="flex-1 p-3 space-y-3 min-h-[300px] bg-rose-50/30" id="col-rejected">
        <div class="skeleton h-24"></div>
      </div>
    </div>
  </div>

  <!-- Modal detail verifikasi -->
  <div id="verifikasi-modal" class="fixed inset-0 z-[80] hidden">
    <div class="absolute inset-0 bg-ink-900/50 backdrop-blur-sm" data-modal-close></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="card w-full max-w-lg max-h-[90vh] overflow-y-auto" id="verifikasi-modal-content">
        <!-- Diisi oleh JS -->
      </div>
    </div>
  </div>
</div>
