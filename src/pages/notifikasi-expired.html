<!-- SIMANTRI — Notifikasi Expired -->
<div class="space-y-6">
  <div>
    <p class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Sistem Peringatan Dini</p>
    <h2 class="text-2xl sm:text-3xl font-extrabold text-ink-900 mt-1">Notifikasi Expired</h2>
    <p class="text-sm text-ink-600 mt-1.5">STR &amp; SIP yang akan expired dalam 90 hari atau sudah expired. Segera lakukan perpanjangan.</p>
  </div>

  <!-- Filter chips -->
  <div class="flex flex-wrap items-center gap-2">
    <span class="text-xs font-semibold text-ink-500 uppercase tracking-wider">Filter:</span>
    <button data-filter="all" class="badge-ink !px-3 !py-1.5 !text-xs hover:bg-ink-200 transition-colors">Semua</button>
    <button data-filter="str" class="badge !px-3 !py-1.5 !text-xs bg-white border border-ink-200 hover:bg-ink-50 transition-colors">STR</button>
    <button data-filter="sip" class="badge !px-3 !py-1.5 !text-xs bg-white border border-ink-200 hover:bg-ink-50 transition-colors">SIP</button>
    <span class="w-px h-5 bg-ink-200 mx-1"></span>
    <button data-filter="hampir" class="badge !px-3 !py-1.5 !text-xs bg-white border border-ink-200 hover:bg-amber-50 hover:text-amber-700 hover:border-amber-200 transition-colors">Hampir Expired (H-90)</button>
    <button data-filter="expired" class="badge !px-3 !py-1.5 !text-xs bg-white border border-ink-200 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 transition-colors">Expired</button>

    <span class="ml-auto text-xs text-ink-500">
      <span id="notif-count" class="font-bold text-ink-800">0</span> notifikasi
    </span>
  </div>

  <!-- Banner summary -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="card p-5 border-l-4 border-l-amber-500">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div>
          <p class="text-xs font-semibold text-ink-500 uppercase tracking-wider">Hampir Expired</p>
          <p class="text-2xl font-extrabold text-amber-600" id="banner-hampir">—</p>
        </div>
      </div>
    </div>
    <div class="card p-5 border-l-4 border-l-rose-500">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <div>
          <p class="text-xs font-semibold text-ink-500 uppercase tracking-wider">Sudah Expired</p>
          <p class="text-2xl font-extrabold text-rose-600" id="banner-expired">—</p>
        </div>
      </div>
    </div>
    <div class="card p-5 border-l-4 border-l-teal-500">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        </div>
        <div>
          <p class="text-xs font-semibold text-ink-500 uppercase tracking-wider">Sudah Ditindaklanjuti</p>
          <p class="text-2xl font-extrabold text-teal-600" id="banner-done">—</p>
        </div>
      </div>
    </div>
  </div>

  <!-- List -->
  <div class="card overflow-hidden">
    <div class="px-5 py-4 border-b border-ink-100 flex items-center justify-between">
      <h3 class="font-bold text-ink-900">Daftar Perlu Tindak Lanjut</h3>
      <button class="btn-outline btn-sm" data-action="mark-all-read">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        Tandai semua dibaca
      </button>
    </div>
    <div class="divide-y divide-ink-100" id="notif-list">
      <div class="p-5 space-y-3">
        <div class="skeleton h-16"></div>
        <div class="skeleton h-16"></div>
        <div class="skeleton h-16"></div>
      </div>
    </div>
  </div>
</div>
