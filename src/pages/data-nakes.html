<!-- SIMANTRI — Data Tenaga Medis -->
<div class="space-y-5">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <p class="text-xs font-semibold text-teal-600 uppercase tracking-wider">Database Tenaga Medis</p>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-ink-900 mt-1">Data Tenaga Medis</h2>
      <p class="text-sm text-ink-600 mt-1.5">Dokter, Dokter Gigi, dan Dokter Spesialis beserta status STR &amp; SIP</p>
    </div>
    <div class="flex gap-2">
      <button class="btn-outline btn-sm" data-action="export-csv">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        CSV
      </button>
      <button class="btn-primary btn-sm" data-action="add-nakes">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Tambah Nakes
      </button>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="card p-4">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
      <!-- Search -->
      <div class="md:col-span-5 relative">
        <svg class="w-4 h-4 text-ink-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="search" id="nakes-search" placeholder="Cari nama, NIK, no STR, atau profesi..." class="input !pl-9" aria-label="Cari nakes" />
      </div>
      <!-- Fasyankes filter -->
      <div class="md:col-span-4">
        <select id="nakes-filter-fasyankes" class="select" aria-label="Filter fasyankes">
          <option value="">Semua Fasyankes</option>
        </select>
      </div>
      <!-- Status filter -->
      <div class="md:col-span-3">
        <select id="nakes-filter-status" class="select" aria-label="Filter status">
          <option value="">Semua Status</option>
          <option value="aktif">Aktif</option>
          <option value="hampir_expired">Hampir Expired</option>
          <option value="expired">Expired</option>
          <option value="nonaktif">Nonaktif</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="data-table table-sticky">
        <thead>
          <tr>
            <th class="w-12">#</th>
            <th>Nama / Profesi</th>
            <th>NIK</th>
            <th>No. STR</th>
            <th>Masa Berlaku STR</th>
            <th>Fasyankes</th>
            <th>Status</th>
            <th class="text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="nakes-tbody">
          <tr><td colspan="8" class="text-center py-12 text-ink-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
    <!-- Pagination -->
    <div class="px-5 py-3 border-t border-ink-100 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm">
      <p class="text-ink-500">
        Menampilkan <span id="nakes-showing" class="font-semibold text-ink-800">0</span> dari
        <span id="nakes-total" class="font-semibold text-ink-800">0</span> nakes
      </p>
      <div class="flex items-center gap-1">
        <button class="btn-ghost btn-sm" disabled>‹ Sebelumnya</button>
        <span class="px-3 py-1.5 text-xs font-semibold bg-teal-600 text-white rounded-lg">1</span>
        <button class="btn-ghost btn-sm" disabled>Berikutnya ›</button>
      </div>
    </div>
  </div>

  <!-- Modal detail -->
  <div id="nakes-modal" class="fixed inset-0 z-[80] hidden">
    <div class="absolute inset-0 bg-ink-900/50 backdrop-blur-sm" data-modal-close></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="card w-full max-w-2xl max-h-[90vh] overflow-y-auto" id="nakes-modal-content">
        <!-- Diisi oleh JS -->
      </div>
    </div>
  </div>
</div>
