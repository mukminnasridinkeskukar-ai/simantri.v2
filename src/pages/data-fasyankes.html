<!-- SIMANTRI — Data Fasyankes & Praktik Mandiri -->
<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <p class="text-xs font-semibold text-teal-600 uppercase tracking-wider">Master Fasyankes &amp; Praktik Mandiri</p>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-ink-900 mt-1">Data Fasyankes &amp; Praktik Mandiri</h2>
      <p class="text-sm text-ink-600 mt-1.5">Daftar Rumah Sakit, Puskesmas, Klinik, Apotek, dan Praktik Mandiri beserta nakes terdaftar</p>
    </div>
    <div class="flex gap-2">
      <button class="btn-outline btn-sm" data-action="refresh">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>
      <button class="btn-primary btn-sm" data-action="add-fasyankes">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Tambah Fasyankes
      </button>
    </div>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="fasyankes-stats">
    <div class="skeleton h-32"></div>
    <div class="skeleton h-32"></div>
    <div class="skeleton h-32"></div>
    <div class="skeleton h-32"></div>
  </div>

  <!-- Filter bar -->
  <div class="card p-4">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
      <!-- Search -->
      <div class="md:col-span-6 relative">
        <svg class="w-4 h-4 text-ink-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="search" id="fasyankes-search" placeholder="Cari nama fasyankes atau alamat..." class="input !pl-9" aria-label="Cari fasyankes" />
      </div>
      <!-- Jenis filter -->
      <div class="md:col-span-4">
        <select id="fasyankes-filter-jenis" class="select" aria-label="Filter jenis fasyankes">
          <option value="">Semua Jenis</option>
          <option value="RS">Rumah Sakit</option>
          <option value="Puskesmas">Puskesmas</option>
          <option value="Klinik Utama">Klinik Utama</option>
          <option value="Klinik Pratama">Klinik Pratama</option>
          <option value="Praktik Mandiri">Praktik Mandiri</option>
          <option value="Apotek">Apotek</option>
        </select>
      </div>
      <!-- View toggle -->
      <div class="md:col-span-2 flex gap-2">
        <button class="btn-outline btn-sm flex-1 !bg-teal-50 !border-teal-200 !text-teal-700" data-view="grid" aria-label="Tampilan grid">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        </button>
        <button class="btn-outline btn-sm flex-1" data-view="map" aria-label="Tampilan peta" title="Lihat peta sebaran">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Grid view -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="fasyankes-grid">
    <!-- Cards diisi JS -->
  </div>

  <!-- Empty state container (akan ditampilkan oleh JS ketika kosong) -->

  <!-- Modal detail -->
  <div id="fasyankes-modal" class="fixed inset-0 z-[80] hidden">
    <div class="absolute inset-0 bg-ink-900/50 backdrop-blur-sm" data-modal-close></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="card w-full max-w-3xl max-h-[90vh] overflow-y-auto" id="fasyankes-modal-content">
        <!-- Diisi oleh JS -->
      </div>
    </div>
  </div>

  <!-- Modal form tambah -->
  <div id="fasyankes-form-modal" class="fixed inset-0 z-[80] hidden">
    <div class="absolute inset-0 bg-ink-900/50 backdrop-blur-sm" data-form-close></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="card w-full max-w-lg" id="fasyankes-form-content">
        <!-- Diisi oleh JS -->
      </div>
    </div>
  </div>
</div>
